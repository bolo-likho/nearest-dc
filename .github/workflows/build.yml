name: Build Nearest DC APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Android project
        run: |
          set -e
          test -f index.html || { echo "index.html repo me nahi hai"; exit 1; }
          test -f logo.png || { echo "logo.png repo me nahi hai"; exit 1; }
          P=android
          J=$P/app/src/main/java/com/puneet/nearestdc
          mkdir -p $J $P/app/src/main/assets
          cp index.html $P/app/src/main/assets/index.html
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=$P/app/src/main/res/mipmap-${s%%:*}
            mkdir -p $d
            convert logo.png -resize ${s##*:}x${s##*:} $d/ic_launcher.png
          done

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'NearestDC'
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          echo "android.useAndroidX=true" > $P/gradle.properties

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.puneet.nearestdc'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.puneet.nearestdc'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application
                  android:label="नज़दीकी DC"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.puneet.nearestdc;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              WebView web;
              SpeechRecognizer sr;
              GeolocationPermissions.Callback geoCb;
              String geoOrigin;

              public class Bridge {
                  @JavascriptInterface
                  public void listen() { runOnUiThread(() -> startListen()); }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, u));
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              cb.invoke(origin, true, false);
                          } else {
                              geoCb = cb;
                              geoOrigin = origin;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 2);
                          }
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              void js(String code) { web.post(() -> web.evaluateJavascript(code, null)); }

              void startListen() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      js("onSpeechState('err','इस फोन में आवाज़ पहचान उपलब्ध नहीं है, नीचे लिखकर खोजें')");
                      return;
                  }
                  if (sr != null) sr.destroy();
                  sr = SpeechRecognizer.createSpeechRecognizer(this);
                  sr.setRecognitionListener(new RecognitionListener() {
                      public void onReadyForSpeech(Bundle p) { js("onSpeechState('on','')"); }
                      public void onBeginningOfSpeech() {}
                      public void onRmsChanged(float v) {}
                      public void onBufferReceived(byte[] buf) {}
                      public void onEndOfSpeech() {}
                      public void onEvent(int t, Bundle p) {}
                      public void onError(int e) { js("onSpeechState('err','आवाज़ समझ नहीं आई, दोबारा बोलें')"); }
                      public void onPartialResults(Bundle p) { send(p, false); }
                      public void onResults(Bundle p) { send(p, true); }
                      void send(Bundle p, boolean fin) {
                          ArrayList<String> l = p.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (l != null && !l.isEmpty()) js("onSpeech(" + JSONObject.quote(l.get(0)) + "," + fin + ")");
                          else if (fin) js("onSpeechState('err','आवाज़ समझ नहीं आई, दोबारा बोलें')");
                      }
                  });
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  sr.startListening(i);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  boolean ok = res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED;
                  if (code == 1) {
                      if (ok) startListen(); else js("onSpeechState('err','माइक की अनुमति दें')");
                  } else if (code == 2 && geoCb != null) {
                      geoCb.invoke(geoOrigin, ok, false);
                      geoCb = null;
                  }
              }

              @Override
              protected void onDestroy() {
                  if (sr != null) sr.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nearest-dc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

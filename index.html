<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>नज़दीकी DC</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FC;--card:#fff;--ink:#0E1B3D;--mut:#5B6785;--blue:#0A57F5;--red:#E8231A;--line:#D5DEF0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--card:#131E3A;--ink:#EAF0FF;--mut:#9AA8CC;--line:#26355F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind',system-ui,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px;text-align:center}
.logo{width:132px;height:132px;object-fit:contain;display:block;margin:6px auto 4px}
h1{font-size:24px;margin:4px 0 2px;font-weight:700}
.sub{color:var(--mut);margin:0 0 22px;font-size:15px}
.mic{width:116px;height:116px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:inline-grid;place-items:center;box-shadow:0 0 0 10px rgba(232,35,26,.15);transition:transform .15s}
.mic:active{transform:scale(.94)}
.mic svg{width:52px;height:52px}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 22px rgba(232,35,26,.05)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{margin:16px 0 4px;min-height:26px;font-weight:500}
.row{display:flex;gap:8px;margin:10px 0 0}
input,button.b{font:inherit}
input{flex:1;min-width:0;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.b{padding:11px 16px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.loc{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;margin-top:10px;cursor:pointer;text-decoration:underline}
#res{margin-top:20px;text-align:left}
.dc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.dc:first-child{border-left-color:var(--blue)}
.dc h2{margin:0;font-size:18px;word-break:break-word}
.km{font-weight:700;color:var(--blue);margin:2px 0}
.ad{color:var(--mut);font-size:14px;margin:0 0 12px}
.act{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--red);font-weight:600;text-align:center}
details{margin-top:26px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details .row{flex-direction:column}
.x{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.x button{border:0;background:none;color:var(--red);font-weight:600;cursor:pointer}
</style>
</head>

   return q===w||(lw>=4&&q.length>=3&&(lev(q,w)/Math.max(q.length,lw)<=(lw>=9?.22:.2)||(pw.length>=4&&P[i]===pw)||(lw>=5&&pw.length>=3&&P[i]===pw&&lev(q,w)/Math.max(q.length,lw)<=.34)||(pw.length>=6&&P[i].length>=6&&lev(P[i].replace(/ngr$/,''),pw)<=1)))||(lw>=5&&q.length>lw&&q.includes(w))})};
 const hit=(w,raw)=>near(w,gl,gp)||(SYN[raw||w]||[]).some(s=>gl.includes(lat(s))||grams(s).some(g2=>gl.includes(lat(g2))));
 const cl=String(t).split(/\s+/).filter(x=>x&&!STOP.has(x.toLowerCase())).map(lat),hitC=w=>cl.some((q,i)=>q===w||(w.length>=5&&q.length>=3&&(lev(q,w)/Math.max(q.length,w.length)<=.2||(pk(w).length>=4&&pk(q)===pk(w)))));
 let r=all().map(d=>{
  const wl=words(areaOf(d)),sg=wl.filter(w=>/^\d+$/.test(w)||(!GEN.has(w)&&w.length>=3)),S=sg.length?sg:wl,core=lat(wl.join('')),cs=sf(core);
  const full=(cs.length>=3&&(cs.length<4?gs.includes(cs):near(cs,gs,gsp)))||(core.length>=6&&gl.some(q=>(q.match(/\d+/g)||[]).join('')===(core.match(/\d+/g)||[]).join('')&&lev(q,core)/Math.max(q.length,core.length)<=.15));
  let m=0,mt=0,ml=0;
  for(const w of S){if(/^\d+$/.test(w)){if(qd.has(w))m++}else if(hit(lat(w),w)){m++;mt++;ml=Math.max(ml,w.length)}}
  const ratio=full?1:m/S.length;
  const c0=lat0(wl.join('')),dist=Math.min(1,...gr.map(x=>{const q=lat0(x);return lev(q,c0)/Math.max(q.length,c0.length)}));
  return{d,ratio,dist,ok:full||(ratio>=.5&&mt>=1&&(S.length===1||ml>=6||m>=2)),city:hitC(lat(cityOf(d)))}}).filter(x=>x.ok);
 if(!r.length){
  const cd=all().filter(d=>hitC(lat(cityOf(d))));
  if(cd.length>1){
   const sc=cd.map(d=>{const c0=lat0(words(areaOf(d)).join('')),cc=lat0(cityOf(d));
    return[d,Math.min(1,...gr.map(x=>{const q=lat0(x);return lev(q,cc)/Math.max(q.length,cc.length)<.3?1:lev(q,c0)/Math.max(q.length,c0.length)}))]}).sort((a,b)=>a[1]-b[1]);
   if(sc[0][1]<=.5&&sc[1][1]-sc[0][1]>=.08)return[sc[0][0]]}
  return[]}
 const b=Math.max(...r.map(x=>x.ratio));r=r.filter(x=>x.ratio>=b-.001);
 if(r.some(x=>x.city))r=r.filter(x=>x.city);
 if(r.length>1){const bd=Math.min(...r.map(x=>x.dist));r=r.filter(x=>x.dist<=bd+.04)}
 return r.map(x=>x.d)}
function sugg(t){
 const gl=grams(t).map(lat),gp=grams(t).map(pk);
 return all().map(d=>{const c=lat(words(areaOf(d)).join(''));let s=1;
  gl.forEach((q,i)=>{if(q.length>=3)s=Math.min(s,lev(q,c)/Math.max(q.length,c.length),pk(c)&&gp[i]===pk(c)?.15:1)});
  return[d,s]}).filter(x=>x[1]<=.6).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0][0].replace(/_D$/,'').replace(/_/g,' '))}
function km(a,b,c,d){const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const link=d=>`https://www.google.com/maps/search/?api=1&query=${d[3]},${d[4]}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(p,label,ex){
 ex=(ex||[]).slice(0,2);
 const a=ex.length?{lat:ex[0][3],lng:ex[0][4]}:p;
 const rest=all().filter(d=>!ex.includes(d)).map(d=>({d,k:km(a.lat,a.lng,d[3],d[4])})).sort((x,y)=>x.k-y.k);
 const top=ex.map(d=>({d,e:1})).concat(rest.slice(0,2-ex.length));
 $('res').innerHTML=top.map((x,i)=>`<div class="dc"><h2>${esc(x.d[0])}</h2><div class="km">${x.e?'इसी इलाके का DC':x.k.toFixed(1)+' किमी दूर (सीधी दूरी)'}</div><p class="ad">${esc(x.d[2]||x.d[1])}</p><div class="act"><a class="b" href="${link(x.d)}" target="_blank" rel="noopener">Maps में खोलें</a><button class="b alt" data-i="${i}">लिंक कॉपी करें</button></div></div>`).join('');
 $('hint').textContent=ex.length?`“${label}” में हमारा DC पहले, फिर उसके पास का:`:(label?`“${label}” के पास के 2 DC:`:'सबसे नज़दीकी 2 DC:');
 $('res').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>copy(top[b.dataset.i].d,b))}
async function copy(d,b){
 const t=link(d)+'\n'+d[0];
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}

const STOP=new Set('के पास नजदीक नज़दीक नजदीकी नज़दीकी सबसे बताओ बताइए बताएं दो मुझे में की का है डीसी dc near nearby nearest show me find to the in of'.split(' '));
async function geo(t,soft){
 const q=t.split(/\s+/).filter(w=>!STOP.has(w.toLowerCase())&&!INTENT.has(w.toLowerCase())).join(' ')||t;
 const e=encodeURIComponent,tries=['viewbox=75.60,27.10,76.00,26.70&bounded=1&q='+e(q+', Jaipur')];
 if(!soft)tries.push('q='+e(q+', Rajasthan'));
 for(const u of tries){try{
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),6000);
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&accept-language=hi&'+u,{signal:c.signal});
  clearTimeout(tm);const j=await r.json();
  if(j[0])return{lat:+j[0].lat,lng:+j[0].lon};
 }catch(e2){}}
 return null}
async function search(t){
 t=t.trim();if(!t)return;$('q').value=t;
 const g=matchG(t),ex=exact(t,g);
 let p=ex.length?{lat:ex[0][3],lng:ex[0][4]}:area(t,g);
 if(p&&p.soft&&!ex.length){$('hint').textContent='इलाका ढूंढ रहा हूँ…';const o=await geo(t,true);if(o)p=o}
 if(!p){$('hint').textContent='इलाका ढूंढ रहा हूँ…';p=await geo(t)}
 if(!p){const sg=sugg(t);$('res').innerHTML='<p class="err">यह इलाका नहीं मिला।'+(sg.length?' क्या आपका मतलब:':' शहर या इलाके का नाम लिखें, या Maps लोकेशन (lat,lng) पेस्ट करें।')+'</p><div class="act" style="justify-content:center">'+sg.map((s,i)=>`<button class="b alt" data-s="${i}">${esc(s)}</button>`).join('')+'</div>';$('res').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>search(sg[b.dataset.s]));$('hint').textContent='';return}
 show(p,t,ex)}
$('go').onclick=()=>search($('q').value);

 if(!navigator.geolocation){$('hint').textContent='इस फोन में लोकेशन उपलब्ध नहीं है';return}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

$('mic').onclick=()=>{

 if(rec){rec.stop();return}
